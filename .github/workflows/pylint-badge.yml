name: Pylint Badge

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run pylint
        run: uv run pylint scripts/ --output-format=text | tee pylint.txt || true

      - name: Get pylint score
        id: pylint
        run: |
          SCORE=$(grep -oP "Your code has been rated at \K[0-9.]+" pylint.txt || echo "0")
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Generate pylint badge
        run: |
          mkdir -p .github/badges
          uv run anybadge --overwrite --value=${{ steps.pylint.outputs.score }} --file=.github/badges/pylint.svg --label=pylint 2=red 4=orange 6=yellow 8=green

      - name: Commit badge
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/pylint.svg
          git diff --staged --quiet || git commit -m "Update pylint badge [skip ci]"
          git push
